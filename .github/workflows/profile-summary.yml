name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'profile-summary-card-output/**'
      - 'README.md'
      - 'assets/**'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate Profile Summary Cards
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        with:
          USERNAME: Madhan310301
          BRANCH_NAME: main
          UTC_OFFSET: 5.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

